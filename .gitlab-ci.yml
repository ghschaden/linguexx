# Run the linguexx regression suite on a current TeX Live.
#
# Kept in step with .github/workflows/ci.yml, which is the reference: the
# suite checks REQUIRED_TOOLS against it by step name, and that is where a
# new requirement is written first.  This file used to be checked by nothing
# at all, so it was the one that drifted -- it installed only poppler-utils
# and python3 long after qpdf and veraPDF had become requirements, so the
# pipeline could not start the suite.  It is now checked too, for the things
# that generalise: the apt packages, an installed tool proving it starts with
# `--version`, and the `--documents` invocation (runtests.tooling_integrity).
# When the two disagree, the GitHub one is right by construction; mirror it.
#
# Written out flat rather than shared through YAML anchors: an anchor on a
# sequence spliced into before_script gives a list of lists, which GitLab
# flattens and a reader does not.  The duplication is three lines.
#
# The official texlive/texlive image ships all three engines and the tagging
# code; everything else is installed here.  A green pipeline means every
# layout and structure assertion passed on pdflatex, xelatex and lualatex,
# and that veraPDF called the tagged build conformant.
image: texlive/texlive:latest

stages:
  - test

regression:
  stage: test
  before_script:
    # qpdf is not decoration: one assertion resolves a named destination to
    # the page it lands on, which is the whole question for a beamer frame
    # (the same example is set on every slide and only one of them is the
    # slide it becomes visible on) and which no poppler tool reports.  Its
    # absence stops the suite before anything runs, so leaving it out costs
    # a pipeline rather than an assertion.
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends python3 poppler-utils qpdf default-jre-headless curl unzip
    # The suite's `ua` case validates the tagged output with veraPDF, the only
    # authoritative oracle for PDF/UA: it is what catches a structure element
    # opened at the wrong moment, which no geometric or flat-structure
    # assertion can see.  Taken from the stable release rather than pinned,
    # deliberately -- a change in the oracle's verdict is something to find
    # out about here.  If this or the `ua` case breaks out of nowhere, check
    # for a new veraPDF release first.  The installer's answer file is the
    # one the GitHub workflow uses; only the checkout variable differs.
    - curl -sSL --retry 3 -o /tmp/verapdf.zip https://software.verapdf.org/releases/verapdf-installer.zip
    - unzip -q /tmp/verapdf.zip -d /tmp/verapdf
    - installer=$(find /tmp/verapdf -name 'verapdf-izpack-installer-*.jar' | head -n1)
    - test -n "$installer" || { echo "veraPDF installer jar not found"; exit 1; }
    - java -jar "$installer" "$CI_PROJECT_DIR/.github/verapdf-auto-install.xml"
    - ln -s /opt/verapdf/verapdf /usr/local/bin/verapdf
    - verapdf --version
  script:
    # --documents builds the manual and the shipped examples and validates
    # ua-demo with veraPDF: the half of CLAUDE.md's gate that is not a test
    # case.  Dropping it is a suite-integrity error, not a quieter pipeline.
    - cd tests
    - python3 runtests.py --documents
  # cache nothing; the image already contains the whole toolchain.

# Manual reconnaissance job for the \alt math-tagging work (see
# experiments/altmath/). Run it from the GitLab pipeline UI ("play" button);
# it prints, from the CI's current TeX Live, which math-tagging commands exist
# and how an \alt-style formula is tagged. Paste its log back for analysis.
# It does not run the suite, so it needs neither qpdf nor veraPDF.
alt-recon:
  stage: test
  when: manual
  allow_failure: true
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends python3 poppler-utils
  script:
    - sh experiments/altmath/run.sh
  artifacts:
    when: always
    paths:
      - experiments/altmath/recon.pdf
      - experiments/altmath/recon.log
    expire_in: 30 days
