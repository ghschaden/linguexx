name: tests

on:
  push:
  pull_request:

jobs:
  # The Python that CHECKS the package -- the suite, tools/, the harness --
  # none of which ships to CTAN.  Its own job, on a plain runner: ruff needs
  # no TeX, and a lint that waits four minutes for a container is a lint that
  # reports late.  `make lint` runs the same thing locally.
  #
  # Deliberately not pinned, like veraPDF below: a new rule in the selected
  # families (F, E, W, UP, B -- see ruff.toml) is something to find out about
  # here.  If this reddens with no source change, read the new rule and either
  # satisfy it or ignore it in ruff.toml with the reason, as the file does for
  # UP031 and B007.
  #
  # It earns the job: during the suite split, F821 caught two genuinely broken
  # references and F401 caught a facade re-export that had been deleted as
  # "unused", which would have shipped a broken `lxx struct`.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ruff
        run: pipx install ruff
      - name: ruff check
        run: |
          ruff --version
          ruff check .

  regression:
    runs-on: ubuntu-latest
    # The official TeX Live image ships all three engines and the tagging code.
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4

      # qpdf is not decoration: one assertion resolves a named destination to
      # the page it lands on, which is the whole question for a beamer frame
      # (the same example is set on every slide and only one of them is the
      # slide it becomes visible on) and which no poppler tool reports.
      - name: Install poppler-utils, qpdf, Python and a JRE
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            python3 poppler-utils qpdf default-jre-headless curl unzip

      # The suite's `ua` case validates the tagged output with veraPDF and
      # fails hard when it is missing, because veraPDF is the only
      # authoritative oracle for PDF/UA: it is what catches a structure
      # element opened at the wrong moment, which no geometric or
      # flat-structure assertion can see.  Taken from the stable release
      # rather than pinned, deliberately -- a change in the oracle's verdict
      # is something to find out about here.  If this step or the `ua` case
      # breaks out of nowhere, check for a new veraPDF release first.
      - name: Install veraPDF
        run: |
          curl -sSL --retry 3 -o /tmp/verapdf.zip \
            https://software.verapdf.org/releases/verapdf-installer.zip
          unzip -q /tmp/verapdf.zip -d /tmp/verapdf
          installer=$(find /tmp/verapdf -name 'verapdf-izpack-installer-*.jar' | head -n1)
          test -n "$installer" || { echo "veraPDF installer jar not found"; exit 1; }
          java -jar "$installer" "$GITHUB_WORKSPACE/.github/verapdf-auto-install.xml"
          ln -s /opt/verapdf/verapdf /usr/local/bin/verapdf
          verapdf --version

      # --documents is the rest of the gate, and the reason it is spelled
      # out here rather than left to a later job: without it CI builds the
      # cases and nothing else, so the manual could stop compiling and
      # examples/ua-demo.pdf could stop being PDF/UA while every push
      # stayed green -- the two checks CLAUDE.md requires before delivering
      # used to run only where the author typed them.  The suite refuses to
      # start if this file drops the flag (runtests.tooling_integrity).
      - name: Run the regression suite, the manual and the examples
        run: |
          cd tests
          python3 runtests.py --documents
